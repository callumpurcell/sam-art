<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Art Store</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 2rem;
}

h1 {
    margin: 0;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 40px;
}

.art {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

.art img {
    width: 100%;
    display: block;
}

.art-info {
    padding: 15px;
}

button {
    background: black;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #333;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
<h1>My Art Store</h1>
<p>Original artwork and prints</p>
</header>

<section class="gallery">

<div class="art">
<img src="images/art1.jpg" alt="Artwork 1">
<div class="art-info">
<h3>Artwork Title</h3>
<p>£40</p>
<button onclick="buy('Artwork Title')">Buy</button>
</div>
</div>

<div class="art">
<img src="images/art2.jpg" alt="Artwork 2">
<div class="art-info">
<h3>Artwork Title 2</h3>
<p>£55</p>
<button onclick="buy('Artwork Title 2')">Buy</button>
</div>
</div>

</section>

<footer>
<p>© 2026 My Art Store</p>
</footer>

<script>
function buy(item) {
    alert("Purchase request for: " + item + "\nConnect this to Stripe or PayPal.");
}
</script>

</body>
</html>
