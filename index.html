<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Art Store</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 2rem;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 40px;
}

.art {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.2s;
}

.art:hover {
    transform: scale(1.03);
}

.art img {
    width: 100%;
}

.art-info {
    padding: 15px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
<h1>My Art Store</h1>
<p>Original artwork and prints</p>
</header>

<section class="gallery">

<div class="art" onclick="openArt('art1')">
<img src="images/art1.jpg">
<div class="art-info">
<h3>London Lights</h3>
<p>£40</p>
</div>
</div>

<div class="art" onclick="openArt('art2')">
<img src="images/art2.jpg">
<div class="art-info">
<h3>City Motion</h3>
<p>£55</p>
</div>
</div>

</section>

<footer>
<p>© 2026 My Art Store</p>
</footer>

<script>
function openArt(id) {
    window.location.href = "art.html?id=" + id;
}
</script>

</body>
</html>
